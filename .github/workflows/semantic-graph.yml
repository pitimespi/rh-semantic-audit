name: RH semantic proof graph checks

on:
  push:
    paths:
      - "semantic_graph/**"
      - "examples/rh_critical_path.json"
      - "examples/rh_analytic_bridge.json"
      - "examples/rh_actual_bridge.json"
      - "examples/rh_witness_assembly.json"
      - "examples/rh_witness_fields.json"
      - "tests/**"
      - "tools/rh_interface_check.py"
      - "tools/rh_analytic_check.py"
      - "tools/rh_witness_fields.py"
      - "tools/rh_minkowski_check.py"
      - "viewer/**"
      - ".github/workflows/semantic-graph.yml"
  pull_request:
    paths:
      - "semantic_graph/**"
      - "examples/rh_critical_path.json"
      - "examples/rh_analytic_bridge.json"
      - "examples/rh_actual_bridge.json"
      - "examples/rh_witness_assembly.json"
      - "examples/rh_witness_fields.json"
      - "tests/**"
      - "tools/rh_interface_check.py"
      - "tools/rh_analytic_check.py"
      - "tools/rh_witness_fields.py"
      - "tools/rh_minkowski_check.py"
      - "viewer/**"
      - ".github/workflows/semantic-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rh-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run graph engine regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate RH graph and generate reports
        run: |
          python -m semantic_graph.cli validate examples/rh_critical_path.json
          python -m semantic_graph.cli validate examples/rh_analytic_bridge.json
          python -m semantic_graph.cli validate examples/rh_actual_bridge.json
          python -m semantic_graph.cli validate examples/rh_witness_assembly.json
          python -m semantic_graph.cli report examples/rh_witness_assembly.json --target nonempty > /tmp/rh-witness-report.md
          python -m semantic_graph.cli report examples/rh_actual_bridge.json --target outer > /tmp/actual-rh-report.md
          python -m semantic_graph.cli report examples/rh_analytic_bridge.json --target everyE2 > /tmp/analytic-report.md
          python -m semantic_graph.cli mermaid examples/rh_critical_path.json > /tmp/rh.mmd
          python -m semantic_graph.cli report examples/rh_critical_path.json --target headline > /tmp/rh-report.md
      - name: Check RH viewer JavaScript
        run: node --check viewer/viewer.js
      - name: Check source-level RH assumptions against pinned mirror
        run: |
          python3 tools/rh_interface_check.py --fetch-pinned
          python3 -m tools.rh_analytic_check --fetch-pinned
          python3 -m tools.rh_analytic_check --fetch-pinned --graph examples/rh_actual_bridge.json
          python3 -m tools.rh_analytic_check --fetch-pinned --graph examples/rh_witness_assembly.json
          python3 -m tools.rh_witness_fields --fetch-pinned --ledger examples/rh_witness_fields.json
          python3 -m tools.rh_minkowski_check --fetch-pinned
